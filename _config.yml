# .well-known is a dot-directory, which Jekyll drops from the published site unless it is listed
# here. It carries the App Links / Universal Links verification files for AniNoti.
include:
  - .well-known

# OctopusPeaks is served from Cloudflare behind a sign-in instead (see OctopusPeaks/README.md),
# so it is kept out of the public GitHub Pages site.
exclude:
  - OctopusPeaks
